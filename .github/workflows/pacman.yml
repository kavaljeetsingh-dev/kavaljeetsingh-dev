name: Generate Pacman Animation

on:
  schedule:
    - cron: "0 */12 * * *" # Runs every 12 hours
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out main branch
        uses: actions/checkout@v4

      - name: Generate pacman contribution graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      - name: Check out assets branch
        uses: actions/checkout@v4
        with:
          ref: assets
          path: assets_branch

      - name: Copy new SVG files to assets checkout
        run: |
          mkdir -p assets_branch/dist

          cp dist/pacman-contribution-graph-dark.svg assets_branch/dist/
          cp dist/pacman-contribution-graph.svg assets_branch/dist/

      - name: Commit and push changes
        run: |
          cd assets_branch

          git config user.name "GitHub Action Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dist/

          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update pacman contribution graph [skip ci]"
          git push origin assets
